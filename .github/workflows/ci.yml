name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile check
        run: |
          python -m compileall -q src

      - name: Run unit tests
        run: |
          PYTHONPATH=src python -m unittest

      - name: Schema validation
        run: |
          PYTHONPATH=src python -m ndefender_antsdr_scan.cli.main validate --log tests/fixtures/valid.jsonl
